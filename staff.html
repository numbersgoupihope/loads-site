<!doctype html>
<html lang="en" data-app="staff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loads staff | Today's loads</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#183a2e">
<link rel="manifest" href="staff.webmanifest">
<link rel="apple-touch-icon" href="icons/staff-180.png">
<meta name="apple-mobile-web-app-title" content="Loads Staff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11.5' fill='%23183a2e'/%3E%3Ccircle cx='12' cy='12' r='6.6' fill='%23b9d6bb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#183a2e;--muted:#4d5b54;--base:#fbf7f1;--mint:#d3e6d4;--cta:#c4235f;--line:#e2e3dc}
*{box-sizing:border-box}
body{margin:0;background:#eef1ec;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#f3ede2;padding:14px 16px 12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.ghost{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(243,237,226,.45);background:none;color:#f3ede2;font-weight:600;cursor:pointer}
.summary{max-width:720px;margin:8px auto 0;font-size:14px;color:#c9d6cc}
.filters{display:flex;gap:8px;overflow-x:auto;max-width:720px;margin:12px auto 0;padding-bottom:2px}
.filters button{flex:none;min-height:36px;padding:4px 14px;border-radius:999px;border:1.5px solid rgba(243,237,226,.35);background:none;color:#f3ede2;font-size:14px;cursor:pointer}
.filters button.on{background:#f3ede2;color:var(--ink);border-color:#f3ede2;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px 12px 48px}
.demo{background:#fff0a0;border:1px dashed #8a6d00;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.order{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(24,58,46,.06)}
.otop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.oname{font-weight:700;font-size:19px;letter-spacing:-.2px}
.chip{flex:none;padding:3px 10px;border-radius:999px;background:var(--mint);font-size:13px;font-weight:600;white-space:nowrap}
.chip.out{background:#f8d7e3}
.chip.done{background:#e3e7e2;color:var(--muted)}
.meta{margin:6px 0 0;font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:12px;background:#f1f4f0;text-decoration:none;font-size:14px;font-weight:600}
.next{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:14px;border:none;border-radius:14px;background:var(--cta);color:#fff;font-size:18px;font-weight:650;cursor:pointer}
.next:disabled{opacity:.6}
.under{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.undo{min-height:40px;padding:4px 0;border:none;background:none;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.weigh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #eef0ec}
.weigh label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.weigh input{width:110px;min-height:44px;padding:8px 10px;border:1.5px solid #d5ddd6;border-radius:10px;background:var(--base)}
.weigh button{min-height:44px;padding:8px 16px;border:none;border-radius:10px;background:var(--ink);color:#f3ede2;font-weight:600;cursor:pointer}
.weigh small{flex-basis:100%;color:var(--muted);font-size:13px}
.pay{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:12px;border-radius:12px;background:#fff6dd}
.pay.ok{background:#e6f2e7}
.pay b{font-size:15px}
.pay button{min-height:44px;padding:8px 16px;border:none;border-radius:10px;background:var(--ink);color:#f3ede2;font-weight:600;cursor:pointer}
.pay p{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
.pay button.undo{min-height:40px;padding:4px 0;background:none;color:var(--muted);font-weight:400;text-decoration:underline}
.pay .bill{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:none;border-radius:12px;background:var(--cta);color:#fff !important;font-size:17px;font-weight:650;cursor:pointer}
.pay .bill:disabled{opacity:.6}
.textlink{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:12px;background:var(--ink);color:#f3ede2;font-size:17px;font-weight:650;text-decoration:none}
.chip.es{background:#fde7c8;margin-right:6px}
.okmsg{color:#1d6b3a;font-size:14px;font-weight:600;min-height:0;margin:8px 0 0}
.newbar{position:sticky;top:96px;z-index:4;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--cta);color:#fff;font-weight:650;box-shadow:0 6px 18px rgba(196,35,95,.3)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.pin{max-width:360px;margin:72px auto;background:#fff;border-radius:20px;padding:28px 24px;text-align:center}
.pin input{width:100%;min-height:56px;margin:16px 0 12px;padding:10px;border:1.5px solid #d5ddd6;border-radius:14px;text-align:center;font-size:24px;letter-spacing:8px}
.pin button{width:100%;min-height:52px;border:none;border-radius:14px;background:var(--ink);color:#f3ede2;font-size:17px;font-weight:650;cursor:pointer}
.err{color:#a3123f;font-size:14px;font-weight:600;min-height:20px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<div class="hrow"><h1>Today's loads</h1><div style="display:flex;gap:8px"><button class="ghost" type="button" data-get-app hidden>Get app</button><button class="ghost" id="refresh" type="button">Refresh</button></div></div>
<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
</header>

<form class="pin" id="pinForm" hidden>
<h2 style="margin:0">Staff sign-in</h2>
<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Staff PIN" placeholder="PIN">
<button type="submit">Open today's loads</button>
<p class="err" id="pinErr" role="alert"></p>
</form>

<main id="app" hidden>
<p class="demo" id="demo" hidden><strong>Preview.</strong> Demo orders, nothing is saved. Once the site is connected this shows real bookings from the Sheet.</p>
<div class="newbar" id="newbar" role="status" hidden></div>
<p class="err" id="err" role="alert"></p>
<p class="okmsg" id="note" role="status"></p>
<div id="list"></div>
</main>

<script src="config.js"></script>
<script src="app-install.js?v=4" defer></script>
<script src="preview-nav.js"></script>
<script>
(function () {
  'use strict';
  const CONFIG = window.LOADS_CONFIG, STAGES = window.LOADS_STAGES;
  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const digits = v => String(v || '').replace(/\D/g, '');
  const idxOf = key => Math.max(0, STAGES.findIndex(s => s.key === key));
  const PREVIEW = !CONFIG.endpoint;
  let pin = '', orders = [], filter = 'all', busy = false;
  try { pin = sessionStorage.getItem('loads_pin') || ''; } catch (e) {}

  /* ---------- talking to the Sheet ---------- */
  async function api(req) {
    if (PREVIEW) return demoApi(req);
    const res = await fetch(CONFIG.endpoint, { method: 'POST', body: JSON.stringify(Object.assign({ pin }, req)) });
    return res.json();
  }
  async function run(req) {
    if (busy) return; busy = true; $('#err').textContent = '';
    if (req.action !== 'list') $('#note').textContent = '';
    try {
      const data = await api(req);
      if (!data.ok && data.error === 'pin') { pin = ''; try { sessionStorage.removeItem('loads_pin'); } catch (e) {} return showPin('That PIN didn’t work.'); }
      if (!data.ok && data.error === 'unpaid') { orders = data.orders || orders; render(); $('#err').textContent = 'That order isn’t paid yet. Send the bill first, or mark it paid if they paid another way.'; return; }
      if (!data.ok && data.message) { orders = data.orders || orders; showApp(); render(); $('#err').textContent = data.message; return; }
      if (!data.ok) throw new Error(data.error || 'failed');
      const fresh = data.orders || [];
      newOrders(fresh);
      orders = fresh; showApp(); render();
      if (data.bill) billNote(req.id, data.bill);
    } catch (e) {
      $('#err').textContent = "Couldn't reach the Sheet. Check the connection and tap Refresh.";
    } finally { busy = false; }
  }

  /* ---------- after Send bill ---------- */
  function billNote(id, bill) {
    const o = orders.find(x => x.id === id), who = o ? (o.name || '').split(/\s+/)[0] : 'them';
    const money = '$' + Number(bill.amount || 0).toFixed(2);
    if (bill.kind === 'charged') $('#note').textContent = 'Charged ' + money + ' to ' + who + '’s saved ' + bill.card + '. Paid.';
    else if (bill.kind === 'paid') $('#note').textContent = 'Already paid.';
    else {
      $('#note').textContent = (bill.declined ? who + '’s saved card didn’t go through, so text the payment link instead. ' : '') +
        (bill.resent ? 'Same bill as before (' + money + '). ' : 'Bill ready: ' + money + '. ') + 'Tap “Text the payment link” on ' + who + '’s order.';
      const link = document.querySelector('.order[data-id="' + id + '"] .textlink');
      if (link) { link.scrollIntoView({ block: 'center', behavior: 'smooth' }); link.focus(); }
    }
  }

  /* ---------- new booking alert ---------- */
  let known = null, audio = null;
  document.addEventListener('pointerdown', () => {   // phones only allow sound after a first tap
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  });
  function chime() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      [880, 1175, 1568].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), at = t + i * 0.16;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
        o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + 0.65);
      });
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function newOrders(fresh) {
    const ids = new Set(fresh.map(o => o.id));
    if (known) {
      const added = fresh.filter(o => !known.has(o.id) && o.stage === 'booked');
      if (added.length) {
        chime();
        $('#newbar').textContent = added.length === 1
          ? 'New booking: ' + added[0].name + ', pickup ' + added[0].pickup_label
          : added.length + ' new bookings';
        $('#newbar').hidden = false;
        clearTimeout(newOrders.t); newOrders.t = setTimeout(() => { $('#newbar').hidden = true; }, 30000);
      }
    }
    known = ids;
  }

  /* ---------- preview data ---------- */
  const demoOrders = [
    { id: 'LDEMO1', name: 'Sam Rivera', phone: '(213) 555-0101', address: '3600 Wilshire Blvd Apt 12', zip: '90010', notes: 'Bag by the mailroom', zone: 'Koreatown + Downtown LA', pickup_date: '2026-11-17', pickup_label: 'Mon, Nov 17', stage: 'booked', weight_lbs: '', order_total: '', first_order_offer: 'yes', first_order: 'yes', paid: false, track_url: 'track.html?id=LDEMO1&t=demo' },
    { id: 'LDEMO2', name: 'Jordan Lee', phone: '(213) 555-0102', address: '880 S Grand Ave #2104', zip: '90015', notes: '', zone: 'Koreatown + Downtown LA', pickup_date: '2026-11-17', pickup_label: 'Mon, Nov 17', stage: 'folding', weight_lbs: 12.4, order_total: 36.99, first_order_offer: 'yes', first_order: 'no', paid: false, track_url: 'track.html?id=LDEMO2&t=demo' },
    { id: 'LDEMO3', name: 'Priya Shah', phone: '(818) 555-0103', address: '14500 Sylvan St Unit 3', zip: '91411', notes: 'Gate code 2244', zone: 'Van Nuys + Sherman Oaks', pickup_date: '2026-11-16', pickup_label: 'Sun, Nov 16', stage: 'out_for_delivery', weight_lbs: 18, order_total: 47.49, first_order_offer: 'yes', first_order: 'no', paid: true, track_url: 'track.html?id=LDEMO3&t=demo' }
  ];
  function demoApi(req) {
    const o = demoOrders.find(x => x.id === req.id);
    const copy = () => demoOrders.map(x => Object.assign({}, x));
    if (o && req.action === 'set_stage') {
      if (idxOf(req.stage) >= idxOf('out_for_delivery') && !o.paid) return Promise.resolve({ ok: false, error: 'unpaid', orders: copy() });
      o.stage = req.stage;
    }
    if (o && req.action === 'set_weight') { o.weight_lbs = Number(req.weight_lbs) || ''; o.order_total = Number(req.order_total) || ''; }
    if (o && req.action === 'set_paid') o.paid = req.paid === true;
    if (o && req.action === 'send_bill') {
      if (o.first_order === 'no') { o.paid = true; return Promise.resolve({ ok: true, orders: copy(), bill: { kind: 'charged', amount: o.order_total, card: 'VISA ending 4242' } }); }
      o.bill_url = 'https://squareup.com/pay-invoice/demo'; o.bill_sent = true;
      return Promise.resolve({ ok: true, orders: copy(), bill: { kind: 'link', url: o.bill_url, amount: o.order_total } });
    }
    return Promise.resolve({ ok: true, orders: copy() });
  }

  /* ---------- pricing ---------- */
  const isFirst = o => (o.first_order ? o.first_order : o.first_order_offer) === 'yes';
  const freeDelivery = o => CONFIG.firstOrderOffer && isFirst(o);
  const minOrder = Number(CONFIG.minOrder) || 0;
  const totalFor = (o, lbs) => Math.max(lbs * CONFIG.pricePerLb, minOrder) + (freeDelivery(o) ? 0 : CONFIG.deliveryFee);
  const underMin = o => minOrder && Number(o.weight_lbs) * CONFIG.pricePerLb < minOrder;

  /* ---------- texts to the customer ---------- */
  const isEs = o => o.lang === 'es' || /^\[Español\]/.test(o.notes || '');
  const DAYS_ES = { Mon: 'lun', Tue: 'mar', Wed: 'mié', Thu: 'jue', Fri: 'vie', Sat: 'sáb', Sun: 'dom' };
  const MONTHS_ES = { Jan: 'ene', Feb: 'feb', Mar: 'mar', Apr: 'abr', May: 'may', Jun: 'jun', Jul: 'jul', Aug: 'ago', Sep: 'sep', Oct: 'oct', Nov: 'nov', Dec: 'dic' };
  const dayEs = l => { const m = String(l || '').match(/^(\w{3}), (\w{3}) (\d{1,2})$/); return m && DAYS_ES[m[1]] && MONTHS_ES[m[2]] ? DAYS_ES[m[1]] + ' ' + m[3] + ' de ' + MONTHS_ES[m[2]] : String(l || ''); };
  function smsBody(o) {
    const es = isEs(o);
    const first = (o.name || '').trim().split(/\s+/)[0] || (es ? '' : 'there');
    const hi = es ? 'Hola ' + first + ', ' : 'Hi ' + first + ', ';
    const link = o.track_url ? (es ? ' Sigue tu pedido aquí: ' : ' Track it here: ') + o.track_url : '';
    const st = STAGES[idxOf(o.stage)];
    const atStore = idxOf(o.stage) >= idxOf('at_store') && idxOf(o.stage) < idxOf('out_for_delivery');
    const money = '$' + Number(o.order_total || 0).toFixed(2);
    const minNote = underMin(o) ? (es ? ', que incluye nuestro mínimo de $' + minOrder : ', which includes our $' + minOrder + ' minimum') : '';
    if (atStore && o.order_total) {
      const weighed = es
        ? hi + 'tu ropa pesó ' + o.weight_lbs + ' libras (te mando foto de la báscula), así que tu total es ' + money + minNote + '. '
        : hi + 'your load weighed in at ' + o.weight_lbs + ' lbs (photo of the scale attached), so your total is ' + money + minNote + '. ';
      if (o.paid) return es ? hi + 'tu ropa pesó ' + o.weight_lbs + ' libras (te mando foto de la báscula). Total ' + money + ', ya pagado. ¡Gracias!' + link
                            : hi + 'your load weighed in at ' + o.weight_lbs + ' lbs (photo of the scale attached). Total ' + money + ', paid. Thanks!' + link;
      if (o.bill_url) return weighed + (es
        ? 'Paga aquí: ' + o.bill_url + ' . Marca “guardar mi tarjeta” y la próxima vez te cobramos automáticamente. Te la entregamos en cuanto esté pagado.'
        : 'Pay here: ' + o.bill_url + ' . Tick “Save my card on file” and next time we’ll charge it automatically. We’ll deliver as soon as it’s paid.');
      return weighed + (es ? 'En un momento te mando el enlace de pago.' : 'Payment link coming next.') + link;
    }
    const win = es ? (CONFIG.pickupWindowEs || CONFIG.pickupWindow) : CONFIG.pickupWindow;
    const msgs = es ? {
      booked: hi + 'somos Loads. Tu recogida está agendada para el ' + dayEs(o.pickup_label) + (win ? ', de ' + win : '') + '. Deja tu bolsa en la puerta.' + link,
      picked_up: hi + 'ya tenemos tu ropa. Va camino a nuestra lavandería.' + link,
      at_store: hi + 'tu ropa ya llegó a nuestra lavandería.' + link,
      out_for_delivery: hi + 'tu ropa va en camino de regreso a tu casa.' + link,
      delivered: hi + 'tu ropa ya está en tu puerta. ¡Gracias por usar Loads!' + (CONFIG.googleReviewUrl ? ' Si tienes un momento, una reseña nos ayuda mucho: ' + CONFIG.googleReviewUrl : '')
    } : {
      booked: hi + "it's Loads. You're booked for pickup " + (o.pickup_label || '') + (win ? ', ' + win : '') + '. Leave your bag by the door.' + link,
      picked_up: hi + "we've got your load. It's on the way to our laundromat." + link,
      at_store: hi + 'your load made it to our laundromat.' + link,
      out_for_delivery: hi + 'your load is out for delivery and headed back to you.' + link,
      delivered: hi + 'your load is back at your door. Thanks for using Loads!' + (CONFIG.googleReviewUrl ? ' If you have a sec, a quick review helps a lot: ' + CONFIG.googleReviewUrl : '')
    };
    return msgs[o.stage] || hi + (es ? 'una actualización de Loads: ' : 'quick update from Loads: ') + st.label.toLowerCase() + '.' + link;
  }
  const smsHref = o => 'sms:' + digits(o.phone) + '?&body=' + encodeURIComponent(smsBody(o));

  /* ---------- screens ---------- */
  function showPin(err) { $('#app').hidden = true; $('#pinForm').hidden = false; $('#pinErr').textContent = err || ''; $('#pin').focus(); }
  function showApp() { $('#pinForm').hidden = true; $('#app').hidden = false; $('#demo').hidden = !PREVIEW; }

  function render() {
    const zones = Array.from(new Set(orders.map(o => o.zone).filter(Boolean)));
    $('#filters').innerHTML = ['all'].concat(zones).map(z => '<button type="button" data-z="' + esc(z) + '" class="' + (z === filter ? 'on' : '') + '">' + (z === 'all' ? 'All zones' : esc(z)) + '</button>').join('');
    const counts = {};
    orders.forEach(o => { counts[o.stage] = (counts[o.stage] || 0) + 1; });
    const parts = STAGES.filter(s => counts[s.key]).map(s => counts[s.key] + ' ' + s.label.toLowerCase());
    $('#summary').textContent = orders.length ? parts.join(' · ') : 'No open orders';
    const shown = orders.filter(o => filter === 'all' || o.zone === filter);
    if (!shown.length) { $('#list').innerHTML = '<p class="empty">Nothing here right now.</p>'; return; }
    $('#list').innerHTML = shown.map(o => {
      const i = idxOf(o.stage), st = STAGES[i], nxt = STAGES[i + 1];
      const chip = o.stage === 'delivered' ? 'done' : o.stage === 'out_for_delivery' ? 'out' : '';
      const weighed = i >= idxOf('at_store');
      const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(o.address + ' ' + o.zip);
      const needsPay = nxt && idxOf(nxt.key) >= idxOf('out_for_delivery') && !o.paid;
      const money = '$' + Number(o.order_total || 0).toFixed(2);
      const otherWay = '<button class="undo" type="button" data-act="paid">Paid another way (cash, Zelle)? Mark paid</button>';
      let pay = '';
      if (weighed && o.order_total) {
        if (o.paid) pay = '<div class="pay ok"><b>Paid · ' + money + '</b><button class="undo" type="button" data-act="unpaid">Undo</button></div>';
        else if (o.bill_sent && o.bill_url) pay = '<div class="pay"><b>Bill sent · waiting for payment</b>' +
          '<a class="textlink" href="' + smsHref(o) + '">Text the payment link</a>' +
          '<p>Attach the photo of the scale. This turns to Paid by itself once they pay.</p>' + otherWay + '</div>';
        else pay = '<div class="pay"><b>Not paid yet · ' + money + '</b>' +
          '<button class="bill" type="button" data-act="bill">Send bill · ' + money + '</button>' +
          '<p>Saved card on file? It’s charged right away. First-time customer? You’ll get a payment link to text them.</p>' + otherWay + '</div>';
      }
      return '<article class="order" data-id="' + esc(o.id) + '">' +
        '<div class="otop"><div><div class="oname">' + esc(o.name) + '</div>' + (isEs(o) ? '<span class="chip es">Habla español</span>' : '') + '<p class="meta">Pickup ' + esc(o.pickup_label) + ' · ' + esc(o.zone) + (isFirst(o) ? ' · first order' : ' · repeat customer') + '</p></div><span class="chip ' + chip + '">' + esc(st.label) + '</span></div>' +
        '<p class="meta"><a href="' + maps + '" target="_blank" rel="noopener">' + esc(o.address) + ', ' + esc(o.zip) + '</a>' + (o.notes ? '<br>Note: ' + esc(o.notes) : '') + '</p>' +
        '<div class="links"><a href="tel:' + digits(o.phone) + '">Call</a><a href="' + smsHref(o) + '">' + (isEs(o) ? 'Text update (Spanish)' : 'Text update') + '</a>' + (o.track_url ? '<a href="' + esc(o.track_url) + '" target="_blank" rel="noopener">Tracker</a>' : '') + '</div>' +
        (nxt ? (needsPay
          ? '<button class="next" type="button" disabled>Waiting on payment</button>'
          : '<button class="next" type="button" data-act="next" data-stage="' + nxt.key + '">Mark: ' + esc(nxt.label) + '</button>') : '') +
        '<div class="under"><span class="meta" style="margin:0">' + esc(o.id) + '</span>' + (i > 0 ? '<button class="undo" type="button" data-act="back" data-stage="' + STAGES[i - 1].key + '">Undo to ' + esc(STAGES[i - 1].label.toLowerCase()) + '</button>' : '') + '</div>' +
        (weighed ? '<div class="weigh"><div><label for="w-' + esc(o.id) + '">Weight (lbs)</label><input id="w-' + esc(o.id) + '" type="number" step="0.1" min="0" inputmode="decimal" value="' + esc(o.weight_lbs) + '" data-w></div><div><label for="t-' + esc(o.id) + '">Total ($)</label><input id="t-' + esc(o.id) + '" type="number" step="0.01" min="0" inputmode="decimal" value="' + esc(o.order_total) + '" data-t></div><button type="button" data-act="weight">Save</button><small>Weigh it dry, before washing. Total fills in as $' + CONFIG.pricePerLb.toFixed(2) + '/lb' + (minOrder ? ' ($' + minOrder + ' minimum)' : '') + (freeDelivery(o) ? ', delivery free (first order)' : ' + $' + CONFIG.deliveryFee.toFixed(2) + ' delivery') + '. Edit it if needed.</small></div>' : '') +
        pay +
        '</article>';
    }).join('');
  }

  /* ---------- actions ---------- */
  $('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.z; render(); } });
  $('#list').addEventListener('input', e => {
    if (!e.target.matches('[data-w]')) return;
    const card = e.target.closest('.order'), o = orders.find(x => x.id === card.dataset.id), w = Number(e.target.value);
    if (o && w > 0) card.querySelector('[data-t]').value = totalFor(o, w).toFixed(2);
  });
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const card = b.closest('.order'), id = card.dataset.id;
    if (b.dataset.act === 'weight') return run({ action: 'set_weight', id, weight_lbs: card.querySelector('[data-w]').value, order_total: card.querySelector('[data-t]').value });
    if (b.dataset.act === 'paid' || b.dataset.act === 'unpaid') { b.disabled = true; return run({ action: 'set_paid', id, paid: b.dataset.act === 'paid' }); }
    if (b.dataset.act === 'bill') { b.disabled = true; b.textContent = 'Sending bill...'; return run({ action: 'send_bill', id }); }
    b.disabled = true;
    run({ action: 'set_stage', id, stage: b.dataset.stage });
  });
  $('#refresh').addEventListener('click', () => run({ action: 'list' }));
  $('#pinForm').addEventListener('submit', e => {
    e.preventDefault(); pin = $('#pin').value.trim();
    try { sessionStorage.setItem('loads_pin', pin); } catch (err) {}
    run({ action: 'list' });
  });
  setInterval(() => {
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#list input');
    if (!document.hidden && !$('#app').hidden && !typing) run({ action: 'list' });
  }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden) run({ action: 'list' }); });

  if (PREVIEW || pin) run({ action: 'list' }); else showPin();
})();
</script>
</body>
</html>
