<!doctype html>
<html lang="en" data-app="staff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loads staff | Today's loads</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#183a2e">
<link rel="manifest" href="staff.webmanifest">
<link rel="apple-touch-icon" href="icons/staff-180.png">
<meta name="apple-mobile-web-app-title" content="Loads Staff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11.5' fill='%23183a2e'/%3E%3Ccircle cx='12' cy='12' r='6.6' fill='%23b9d6bb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#183a2e;--muted:#4d5b54;--base:#fbf7f1;--mint:#d3e6d4;--cta:#c4235f;--line:#e2e3dc}
*{box-sizing:border-box}
body{margin:0;background:#eef1ec;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#f3ede2;padding:14px 16px 12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.ghost{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid rgba(243,237,226,.45);background:none;color:#f3ede2;font-weight:600;cursor:pointer}
.summary{max-width:720px;margin:8px auto 0;font-size:14px;color:#c9d6cc}
.filters{display:flex;gap:8px;overflow-x:auto;max-width:720px;margin:12px auto 0;padding-bottom:2px}
.filters button{flex:none;min-height:36px;padding:4px 14px;border-radius:999px;border:1.5px solid rgba(243,237,226,.35);background:none;color:#f3ede2;font-size:14px;cursor:pointer}
.filters button.on{background:#f3ede2;color:var(--ink);border-color:#f3ede2;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px 12px 48px}
.demo{background:#fff0a0;border:1px dashed #8a6d00;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.order{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(24,58,46,.06)}
.otop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.oname{font-weight:700;font-size:19px;letter-spacing:-.2px}
.chip{flex:none;padding:3px 10px;border-radius:999px;background:var(--mint);font-size:13px;font-weight:600;white-space:nowrap}
.chip.out{background:#f8d7e3}
.chip.done{background:#e3e7e2;color:var(--muted)}
.meta{margin:6px 0 0;font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:12px;background:#f1f4f0;text-decoration:none;font-size:14px;font-weight:600}
.next{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:14px;border:none;border-radius:14px;background:var(--cta);color:#fff;font-size:18px;font-weight:650;cursor:pointer}
.next:disabled{opacity:.6}
a.next{text-decoration:none}
.next.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.etaline{margin:12px 0 0;font-size:15px}
.cancelask{margin-top:12px;padding:12px;border-radius:12px;background:#fff0f3;font-size:15px}
.cancelask div{display:flex;gap:8px;margin-top:10px}
.cancelask button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:650;cursor:pointer}
.cancelask button.yes{background:#9f1239;border-color:#9f1239;color:#fff}
.okmsg a{color:#1d6b3a}
.mins{display:flex;gap:8px;margin-top:8px}
.mins button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:650;cursor:pointer}
.driver{display:flex;align-items:center;gap:10px;justify-content:center;margin:20px 0 0;font-size:14px;color:var(--muted)}
.driver input{width:130px;min-height:40px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:16px}
.chip.hot{background:#ffe2d6;color:#9a3412}
.chip.cold{background:#dbeafe;color:#1e3a8a}
.under{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.undo{min-height:40px;padding:4px 0;border:none;background:none;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.weigh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #eef0ec}
.weigh label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.weigh input{width:110px;min-height:44px;padding:8px 10px;border:1.5px solid #d5ddd6;border-radius:10px;background:var(--base)}
.weigh button{min-height:44px;padding:8px 16px;border:none;border-radius:10px;background:var(--ink);color:#f3ede2;font-weight:600;cursor:pointer}
.weigh small{flex-basis:100%;color:var(--muted);font-size:13px}
.pay{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:12px;border-radius:12px;background:#fff6dd}
.pay.ok{background:#e6f2e7}
.pay b{font-size:15px}
.pay button{min-height:44px;padding:8px 16px;border:none;border-radius:10px;background:var(--ink);color:#f3ede2;font-weight:600;cursor:pointer}
.pay p{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
.pay button.undo{min-height:40px;padding:4px 0;background:none;color:var(--muted);font-weight:400;text-decoration:underline}
.pay .bill{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:none;border-radius:12px;background:var(--cta);color:#fff !important;font-size:17px;font-weight:650;cursor:pointer}
.pay .bill:disabled{opacity:.6}
.textlink{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:12px;background:var(--ink);color:#f3ede2;font-size:17px;font-weight:650;text-decoration:none}
.group{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.group:first-child{margin-top:4px}
.group span{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none}
details.done{margin-top:22px}
details.done summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
details.done summary::-webkit-details-marker{display:none}
details.done summary::after{content:'Show';font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;text-decoration:underline}
details.done[open] summary::after{content:'Hide'}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:8px;font-size:15px}
.mini b{font-weight:650}
.mini span{color:var(--muted);font-size:14px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.chip.paid{background:#cfeccf;color:#14532d}
.chip.unpaid{background:#fde2b0;color:#7a4b00}
.chip.es{background:#fde7c8;margin-right:6px}
.chip.plan{background:#dfe7fb;color:#1e3a8a;margin-right:6px}
.okmsg{color:#1d6b3a;font-size:14px;font-weight:600;min-height:0;margin:8px 0 0}
.newbar{position:sticky;top:96px;z-index:4;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--cta);color:#fff;font-weight:650;box-shadow:0 6px 18px rgba(196,35,95,.3)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.pin{max-width:360px;margin:72px auto;background:#fff;border-radius:20px;padding:28px 24px;text-align:center}
.pin input{width:100%;min-height:56px;margin:16px 0 12px;padding:10px;border:1.5px solid #d5ddd6;border-radius:14px;text-align:center;font-size:24px;letter-spacing:8px}
.pin button{width:100%;min-height:52px;border:none;border-radius:14px;background:var(--ink);color:#f3ede2;font-size:17px;font-weight:650;cursor:pointer}
.err{color:#a3123f;font-size:14px;font-weight:600;min-height:20px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<div class="hrow"><h1>Today's loads</h1><div style="display:flex;gap:8px"><button class="ghost" type="button" data-get-app hidden>Get app</button><button class="ghost" id="refresh" type="button">Refresh</button></div></div>
<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
</header>

<form class="pin" id="pinForm" hidden>
<h2 style="margin:0">Staff sign-in</h2>
<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Staff PIN" placeholder="PIN">
<button type="submit">Open today's loads</button>
<p class="err" id="pinErr" role="alert"></p>
</form>

<main id="app" hidden>
<p class="demo" id="demo" hidden><strong>Preview.</strong> Demo orders, nothing is saved. Once the site is connected this shows real bookings from the Sheet.</p>
<div class="newbar" id="newbar" role="status" hidden></div>
<p class="err" id="err" role="alert"></p>
<p class="okmsg" id="note" role="status"></p>
<div id="list"></div>
<label class="driver">Your first name for texts <input id="driver" type="text" autocomplete="given-name" placeholder="Carlos"></label>
<p style="text-align:center;margin:16px 0 0"><button class="undo" type="button" id="signout">Sign out of this phone</button></p>
</main>

<script src="config.js?v=5"></script>
<script src="app-install.js?v=4" defer></script>
<script src="preview-nav.js"></script>
<script>
(function () {
  'use strict';
  const CONFIG = window.LOADS_CONFIG, STAGES = window.LOADS_STAGES;
  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const digits = v => String(v || '').replace(/\D/g, '');
  const idxOf = key => Math.max(0, STAGES.findIndex(s => s.key === key));
  const PREVIEW = !CONFIG.endpoint;
  let pin = '', orders = [], filter = 'all', busy = false;
  // The PIN is remembered on this phone for 30 days, so staff open the app and go. "Sign out" forgets it.
  const PIN_DAYS = 30;
  function savePin(v) { try { localStorage.setItem('loads_pin', JSON.stringify({ v, until: Date.now() + PIN_DAYS * 864e5 })); } catch (e) {} }
  function forgetPin() { pin = ''; try { localStorage.removeItem('loads_pin'); sessionStorage.removeItem('loads_pin'); } catch (e) {} }
  try {
    const saved = JSON.parse(localStorage.getItem('loads_pin') || 'null');
    if (saved && saved.v && saved.until > Date.now()) { pin = saved.v; savePin(pin); }   // using it keeps it fresh
    else localStorage.removeItem('loads_pin');
  } catch (e) {}

  /* ---------- talking to the Sheet ---------- */
  async function api(req) {
    if (PREVIEW) return demoApi(req);
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), req.action === 'send_bill' ? 45000 : 25000);
    try {
      const res = await fetch(CONFIG.endpoint, { method: 'POST', body: JSON.stringify(Object.assign({ pin }, req)), signal: ctl.signal });
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  async function run(req) {
    if (busy) return; busy = true; $('#err').textContent = '';
    if (req.action !== 'list') $('#note').textContent = '';
    try {
      const data = await api(req);
      if (!data.ok && data.error === 'pin') { forgetPin(); return showPin('That PIN didn’t work.'); }
      if (!data.ok && data.error === 'cant_cancel') { orders = data.orders || orders; render(); $('#err').textContent = 'That order is already picked up, so it can’t be canceled here.'; return; }
      if (!data.ok && data.error === 'no_eta') { orders = data.orders || orders; etaAsk[req.id] = req.stage; render(); return; }
      if (!data.ok && data.error === 'unpaid') { orders = data.orders || orders; render(); $('#err').textContent = 'That order isn’t paid yet. Send the bill first, or mark it paid if they paid another way.'; return; }
      if (!data.ok && data.message) { orders = data.orders || orders; showApp(); render(); $('#err').textContent = data.message; return; }
      if (!data.ok) throw new Error(data.error || 'failed');
      const fresh = data.orders || [];
      newOrders(fresh);
      orders = fresh; showApp(); render();
      if (data.bill) billNote(req.id, data.bill);
    } catch (e) {
      $('#err').textContent = "Couldn't reach the Sheet. Check the connection and tap Refresh.";
    } finally { busy = false; }
  }

  /* ---------- after Send bill ---------- */
  function billNote(id, bill) {
    const o = orders.find(x => x.id === id), who = o ? (o.name || '').split(/\s+/)[0] : 'them';
    const money = '$' + Number(bill.amount || 0).toFixed(2);
    if (bill.kind === 'charged') $('#note').textContent = 'Charged ' + money + ' to ' + who + '’s saved ' + bill.card + '. Paid.';
    else if (bill.kind === 'covered') $('#note').textContent = 'Nothing to charge: ' + who + '’s pickup is covered by Loads Weekly. Marked paid.';
    else if (bill.kind === 'paid') $('#note').textContent = 'Already paid.';
    else {
      $('#note').textContent = (bill.declined ? who + '’s saved card didn’t go through, so text the payment link instead. ' : '') +
        (bill.resent ? 'Same bill as before (' + money + '). ' : 'Bill ready: ' + money + '. ') + 'Tap “Text the payment link” on ' + who + '’s order.';
      const link = document.querySelector('.order[data-id="' + id + '"] .textlink');
      if (link) { link.scrollIntoView({ block: 'center', behavior: 'smooth' }); link.focus(); }
    }
  }

  /* ---------- new booking alert ---------- */
  let known = null, wasPaid = null, audio = null;
  document.addEventListener('pointerdown', () => {   // phones only allow sound after a first tap
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  });
  function chime() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      [880, 1175, 1568].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), at = t + i * 0.16;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.6);
        o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + 0.65);
      });
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function banner(text) {
    // sit just under the sticky header, so the banner shows even when scrolled down the list
    $('#newbar').textContent = text; $('#newbar').style.top = ($('header').offsetHeight + 8) + 'px'; $('#newbar').hidden = false;
    clearTimeout(banner.t); banner.t = setTimeout(() => { $('#newbar').hidden = true; }, 30000);
  }
  function newOrders(fresh) {
    const ids = new Set(fresh.map(o => o.id));
    const paidNow = new Set(fresh.filter(o => o.paid).map(o => o.id));
    if (known) {
      const added = fresh.filter(o => !known.has(o.id) && o.stage === 'booked');
      // a customer paid since the last refresh (Square link or saved card)
      const justPaid = fresh.filter(o => o.paid && wasPaid && !wasPaid.has(o.id) && known.has(o.id));
      if (added.length) {
        chime();
        banner(added.length === 1 ? 'New booking: ' + added[0].name + ', pickup ' + added[0].pickup_label : added.length + ' new bookings');
      } else if (justPaid.length) {
        chime();
        banner(justPaid.length === 1 ? justPaid[0].name + ' paid. Ready to go out for delivery.' : justPaid.length + ' customers paid. Ready to go out.');
      }
    }
    known = ids; wasPaid = paidNow;
  }

  /* ---------- preview data ---------- */
  const demoOrders = [
    { id: 'LDEMO1', name: 'Sam Rivera', phone: '(213) 555-0101', address: '3600 Wilshire Blvd Apt 12', zip: '90010', notes: 'Bag by the mailroom', zone: 'Koreatown store', pickup_date: '2026-11-17', pickup_label: 'Mon, Nov 17', pickup_window: '9 to 11am', dropoff_label: 'Tue, Nov 18', dropoff_window: '11am to 1pm', wash_temp: 'Cold', stage: 'booked', weight_lbs: '', order_total: '', first_order_offer: 'yes', first_order: 'yes', paid: false, track_url: 'track.html?id=LDEMO1&t=demo' },
    { id: 'LDEMO2', name: 'Jordan Lee', phone: '(213) 555-0102', address: '880 S Grand Ave #2104', zip: '90015', notes: '', zone: 'Koreatown store', pickup_date: '2026-11-17', pickup_label: 'Mon, Nov 17', pickup_window: '1 to 3pm', dropoff_label: 'Tue, Nov 18', dropoff_window: '5 to 7pm', wash_temp: 'Hot', stage: 'folding', weight_lbs: 12.4, order_total: 36.99, first_order_offer: 'yes', first_order: 'no', paid: false, track_url: 'track.html?id=LDEMO2&t=demo' },
    { id: 'LDEMO3', name: 'Priya Shah', phone: '(818) 555-0103', address: '14500 Sylvan St Unit 3', zip: '91411', notes: 'Gate code 2244', zone: 'Van Nuys store', pickup_date: '2026-11-16', pickup_label: 'Sun, Nov 16', pickup_window: '7 to 9pm', dropoff_label: 'Mon, Nov 17', dropoff_window: '9pm to midnight', wash_temp: 'Cold', stage: 'out_for_delivery', weight_lbs: 18, order_total: 47.49, first_order_offer: 'yes', first_order: 'no', paid: true, track_url: 'track.html?id=LDEMO3&t=demo' },
    { id: 'LDEMO4', name: 'Rosa Diaz', phone: '(818) 555-0163', address: '6720 Woodman Ave #12', zip: '91401', notes: '', zone: 'Van Nuys store', pickup_date: '2026-11-17', pickup_label: 'Mon, Nov 17', stage: 'washing', weight_lbs: 34.5, order_total: 17.12, first_order_offer: 'yes', first_order: 'no', paid: false, subscriber: true, plan_extra: false, track_url: 'track.html?id=LDEMO4&t=demo' }
  ];
  function demoApi(req) {
    const o = demoOrders.find(x => x.id === req.id);
    const copy = () => demoOrders.filter(x => x.stage !== 'canceled').map(x => Object.assign({}, x));
    if (o && req.action === 'cancel') { if (o.stage !== 'booked' && o.stage !== 'on_the_way') return Promise.resolve({ ok: false, error: 'cant_cancel', orders: copy() }); o.canceled_from = o.stage; o.stage = 'canceled'; }
    if (o && req.action === 'uncancel' && o.stage === 'canceled') o.stage = o.canceled_from || 'booked';
    if (o && req.action === 'set_stage') {
      if (idxOf(req.stage) >= idxOf('out_for_delivery') && !o.paid) return Promise.resolve({ ok: false, error: 'unpaid', orders: copy() });
      o.stage = req.stage;
    }
    if (o && req.action === 'set_weight') { o.weight_lbs = Number(req.weight_lbs) || ''; o.order_total = String(req.order_total).trim() === '' ? '' : Number(req.order_total); }
    if (o && req.action === 'set_paid') o.paid = req.paid === true;
    if (o && req.action === 'eta') {
      if (!req.minutes && req.lat === undefined) return Promise.resolve({ ok: false, error: 'no_eta', orders: copy() });
      if (req.stage === 'out_for_delivery' && !o.paid) return Promise.resolve({ ok: false, error: 'unpaid', orders: copy() });
      o.stage = req.stage; o.eta_at = new Date(Date.now() + (Number(req.minutes) || 20) * 60000).toISOString();
      return Promise.resolve({ ok: true, orders: copy(), eta: { minutes: Number(req.minutes) || 20, at: o.eta_at } });
    }
    if (o && req.action === 'send_bill') {
      if (o.subscriber && Number(o.order_total) === 0) { o.paid = true; return Promise.resolve({ ok: true, orders: copy(), bill: { kind: 'covered', amount: 0 } }); }
      if (o.first_order === 'no') { o.paid = true; return Promise.resolve({ ok: true, orders: copy(), bill: { kind: 'charged', amount: o.order_total, card: 'VISA ending 4242' } }); }
      o.bill_url = 'https://squareup.com/pay-invoice/demo'; o.bill_sent = true;
      return Promise.resolve({ ok: true, orders: copy(), bill: { kind: 'link', url: o.bill_url, amount: o.order_total } });
    }
    return Promise.resolve({ ok: true, orders: copy() });
  }

  /* ---------- pricing (same as apps-script/Square.gs) ---------- */
  const isFirst = o => (o.first_order ? o.first_order : o.first_order_offer) === 'yes';
  const freeDelivery = o => CONFIG.firstOrderOffer && isFirst(o);
  const minOrder = Number(CONFIG.minOrder) || 0;
  const PLAN = CONFIG.plan || {};
  const orderDelivery = (Number(CONFIG.deliveryFee) || 0) * (Number(CONFIG.tripsPerOrder) || 2);   // $6.99 each way
  const cents = n => Math.round(n * 100) / 100;
  const totalFor = (o, lbs) => {
    lbs = Math.round(lbs * 10) / 10;
    if (o.subscriber) {                          // Loads Weekly
      const del = freeDelivery(o) ? 0 : PLAN.deliveryPerOrder;
      if (o.plan_extra) return cents(lbs * PLAN.extraPickupPerLb) + del;
      return cents(Math.round(Math.max(0, lbs - PLAN.lbsPerWeek) * 10) / 10 * PLAN.overPerLb) + del;
    }
    return Math.max(lbs * CONFIG.pricePerLb, minOrder) + (freeDelivery(o) ? 0 : orderDelivery);
  };
  const underMin = o => !o.subscriber && minOrder && Number(o.weight_lbs) * CONFIG.pricePerLb < minOrder;
  const hasTotal = o => o.order_total !== '' && o.order_total != null && !isNaN(Number(o.order_total));
  const priceHelp = o => {
    const del = freeDelivery(o) ? 'delivery free (first order)' : null;
    if (o.subscriber && o.plan_extra) return 'Loads Weekly extra pickup: $' + PLAN.extraPickupPerLb.toFixed(2) + '/lb, ' + (del || '+ $' + PLAN.deliveryPerOrder.toFixed(2) + ' delivery');
    if (o.subscriber) return 'Loads Weekly: first ' + PLAN.lbsPerWeek + ' lb included, then $' + PLAN.overPerLb.toFixed(2) + '/lb, ' + (del || '+ $' + PLAN.deliveryPerOrder.toFixed(2) + ' delivery');
    return '$' + CONFIG.pricePerLb.toFixed(2) + '/lb' + (minOrder ? ' ($' + minOrder + ' minimum)' : '') + ', ' + (del || '+ $' + orderDelivery.toFixed(2) + ' delivery ($' + Number(CONFIG.deliveryFee).toFixed(2) + ' each way)');
  };

  /* ---------- texts to the customer ---------- */
  const isTest = o => /^test\b/i.test((o.name || '').trim());
  const billMoney = o => '$' + Number(o.bill_total || (isTest(o) ? 1 : o.order_total) || 0).toFixed(2);
  const isEs = o => o.lang === 'es' || /^\[Español\]/.test(o.notes || '');
  const DAYS_ES = { Mon: 'lun', Tue: 'mar', Wed: 'mié', Thu: 'jue', Fri: 'vie', Sat: 'sáb', Sun: 'dom' };
  const MONTHS_ES = { Jan: 'ene', Feb: 'feb', Mar: 'mar', Apr: 'abr', May: 'may', Jun: 'jun', Jul: 'jul', Aug: 'ago', Sep: 'sep', Oct: 'oct', Nov: 'nov', Dec: 'dic' };
  const dayEs = l => { const m = String(l || '').match(/^(\w{3}), (\w{3}) (\d{1,2})$/); return m && DAYS_ES[m[1]] && MONTHS_ES[m[2]] ? DAYS_ES[m[1]] + ' ' + m[3] + ' de ' + MONTHS_ES[m[2]] : String(l || ''); };
  // Pickup windows are stored in English ("9 to 11am"); config.js has the Spanish.
  const winEs = w => { const hit = (CONFIG.windows || []).find(x => x.en === w); return hit && hit.es ? hit.es : String(w || ''); };
  const when = (day, win) => [day, win].filter(Boolean).join(', ');
  // Arrival estimate from "On my way" / "Out for delivery" (set by the server from the phone's location).
  const etaOf = (o, stage) => {
    if (!o.eta_at || o.stage !== stage) return null;
    const at = new Date(o.eta_at).getTime(), now = Date.now();
    if (!(at > now - 3 * 3600e3)) return null;                       // stale after 3 hours
    const when = Math.round(Math.max(at, now + 5 * 60000) / 300000) * 300000;   // nearest 5 minutes
    return { min: Math.max(5, Math.round((when - now) / 300000) * 5), at: new Date(when) };
  };
  const clockEn = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }).replace(/\s/g, '').toLowerCase();
  const clockEs = d => { const c = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }); return (/^1:/.test(c) ? 'la ' : 'las ') + c.replace(' AM', ' a.m.').replace(' PM', ' p.m.'); };
  const driverName = () => { try { return (localStorage.getItem('loads_driver') || '').trim(); } catch (e) { return ''; } };
  function smsBody(o, stage) {
    stage = stage || o.stage;
    const eta = etaOf(o, stage), who = driverName();
    const es = isEs(o);
    const first = (o.name || '').trim().split(/\s+/)[0] || (es ? '' : 'there');
    const hi = es ? 'Hola ' + first + ', ' : 'Hi ' + first + ', ';
    const link = o.track_url ? (es ? ' Sigue tu pedido aquí: ' : ' Track it here: ') + o.track_url : '';
    const st = STAGES[idxOf(stage)];
    const atStore = idxOf(stage) >= idxOf('at_store') && idxOf(stage) < idxOf('out_for_delivery');
    const money = o.bill_url ? billMoney(o) : '$' + Number(o.order_total || 0).toFixed(2);
    const minNote = underMin(o) ? (es ? ', que incluye nuestro mínimo de $' + minOrder : ', which includes our $' + minOrder + ' minimum') : '';
    if (atStore && hasTotal(o) && o.subscriber && Number(o.order_total) === 0) {
      return es ? hi + 'tu ropa pesó ' + o.weight_lbs + ' libras (te mando foto de la báscula). Está cubierta por tu plan Loads Weekly, así que no hay nada que pagar.' + link
                : hi + 'your load weighed in at ' + o.weight_lbs + ' lbs (photo of the scale attached). It’s covered by your Loads Weekly plan, so there’s nothing to pay.' + link;
    }
    if (atStore && hasTotal(o)) {
      const weighed = es
        ? hi + 'tu ropa pesó ' + o.weight_lbs + ' libras (te mando foto de la báscula), así que tu total es ' + money + minNote + '. '
        : hi + 'your load weighed in at ' + o.weight_lbs + ' lbs (photo of the scale attached), so your total is ' + money + minNote + '. ';
      if (o.paid) return es ? hi + 'tu ropa pesó ' + o.weight_lbs + ' libras (te mando foto de la báscula). Total ' + money + ', ya pagado. ¡Gracias!' + link
                            : hi + 'your load weighed in at ' + o.weight_lbs + ' lbs (photo of the scale attached). Total ' + money + ', paid. Thanks!' + link;
      if (o.bill_url) return weighed + (es
        ? 'Paga aquí: ' + o.bill_url + ' . Marca “guardar mi tarjeta” y la próxima vez te cobramos automáticamente. Te la entregamos en cuanto esté pagado.'
        : 'Pay here: ' + o.bill_url + ' . Tick “Save my card on file” and next time we’ll charge it automatically. We’ll deliver as soon as it’s paid.');
      return weighed + (es ? 'En un momento te mando el enlace de pago.' : 'Payment link coming next.') + link;
    }
    if (eta && stage === 'on_the_way') return es
      ? hi + 'somos Loads. ' + (who ? who + ' va' : 'Tu chofer va') + ' en camino, como a ' + eta.min + ' minutos. Llega alrededor de ' + clockEs(eta.at) + '. Por favor ten tu bolsa en la puerta.' + link
      : hi + "it's Loads. " + (who ? who + ' is' : 'Your driver is') + ' on the way, about ' + eta.min + ' minutes out. Arriving around ' + clockEn(eta.at) + '. Please have your bag by the door.' + link;
    if (eta && stage === 'out_for_delivery') return es
      ? hi + 'tu ropa limpia va de regreso. ' + (who ? who + ' está' : 'Tu chofer está') + ' como a ' + eta.min + ' minutos, llega alrededor de ' + clockEs(eta.at) + '.' + link
      : hi + 'your clean laundry is on the way back. ' + (who ? who + ' is' : 'Your driver is') + ' about ' + eta.min + ' minutes out, arriving around ' + clockEn(eta.at) + '.' + link;
    const msgs = es ? {
      booked: hi + 'somos Loads. Tu recogida está agendada para el ' + dayEs(o.pickup_label) + (o.pickup_window ? ', de ' + winEs(o.pickup_window) : '') + '. Te mandamos un texto cuando tu chofer vaya en camino, como una hora antes. Deja tu bolsa en la puerta.' + link,
      on_the_way: hi + 'somos Loads. Tu chofer va en camino y llega en aproximadamente una hora. Por favor ten tu bolsa en la puerta.' + link,
      picked_up: hi + 'ya tenemos tu ropa. Va camino a nuestra lavandería.' + link,
      at_store: hi + 'tu ropa ya llegó a nuestra lavandería.' + link,
      out_for_delivery: hi + 'tu ropa limpia va de regreso. Tu chofer llega en aproximadamente una hora.' + link,
      delivered: hi + 'tu ropa ya está en tu puerta. ¡Gracias por usar Loads!' + (CONFIG.googleReviewUrl ? ' Si tienes un momento, una reseña nos ayuda mucho: ' + CONFIG.googleReviewUrl : '')
    } : {
      booked: hi + "it's Loads. You're booked for pickup " + when(o.pickup_label, o.pickup_window) + ". We'll text you when your driver is on the way, about an hour before. Leave your bag by the door." + link,
      on_the_way: hi + "it's Loads. Your driver is on the way and will be there within about an hour. Please have your bag by the door." + link,
      picked_up: hi + "we've got your load. It's on the way to our laundromat." + link,
      at_store: hi + 'your load made it to our laundromat.' + link,
      out_for_delivery: hi + 'your clean laundry is on the way back to you. Your driver will be there within about an hour.' + link,
      delivered: hi + 'your load is back at your door. Thanks for using Loads!' + (CONFIG.googleReviewUrl ? ' If you have a sec, a quick review helps a lot: ' + CONFIG.googleReviewUrl : '')
    };
    return msgs[stage] || hi + (es ? 'una actualización de Loads: ' : 'quick update from Loads: ') + st.label.toLowerCase() + '.' + link;
  }
  const smsHref = (o, stage) => 'sms:' + digits(o.phone) + '?&body=' + encodeURIComponent(smsBody(o, stage));
  // "On my way" and "Out for delivery": the app works out the arrival time, then one tap texts it.
  const TEXT_STEPS = { on_the_way: 'On my way', out_for_delivery: 'Out for delivery' };
  const etaAsk = {};                        // order id -> stage, when the drive time couldn't be worked out
  const cancelAsk = {};                     // order id -> true while "Cancel this pickup?" is showing
  const canCancel = o => o.stage === 'booked' || o.stage === 'on_the_way';
  const cancelText = o => isEs(o)
    ? 'Hola ' + firstName(o) + ', somos Loads. Tu recogida quedó cancelada. Agenda de nuevo cuando quieras en loadspickup.com.'
    : 'Hi ' + firstName(o) + ", it's Loads. Your pickup is canceled. Book again anytime at loadspickup.com.";
  async function cancelOrder(id) {
    const o = Object.assign({}, orders.find(x => x.id === id));
    delete cancelAsk[id];
    await new Promise(r => { const go = () => busy ? setTimeout(go, 250) : r(); go(); });
    await run({ action: 'cancel', id });
    if (orders.some(x => x.id === id)) return;           // didn't go through; the error shows at the top
    $('#note').innerHTML = 'Canceled ' + esc(o.name) + '’s pickup. <a href="sms:' + digits(o.phone) + '?&body=' + encodeURIComponent(cancelText(o)) + '">Text ' + esc(firstName(o)) + '</a> · <button class="undo" type="button" data-undo-cancel="' + esc(id) + '">Undo</button>';
    $('#note').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const finding = {};                       // order id -> true while the drive time is being worked out
  const texted = new Set((() => { try { return JSON.parse(localStorage.getItem('loads_texted') || '[]'); } catch (e) { return []; } })());
  const markTexted = k => { texted.add(k); try { localStorage.setItem('loads_texted', JSON.stringify(Array.from(texted).slice(-60))); } catch (e) {} };
  const firstName = o => (o.name || '').trim().split(/\s+/)[0] || 'customer';
  const minButtons = (stage) => '<div class="mins">' + [15, 30, 45, 60].map(m => '<button type="button" data-act="eta" data-stage="' + stage + '" data-min="' + m + '">' + m + ' min</button>').join('') + '</div>';
  function stepBlock(o, nxt, needsPay) {
    // At "Driver on the way" / "Out for delivery" with an arrival time: text it, then carry on.
    const etaHere = TEXT_STEPS[o.stage] && etaOf(o, o.stage);
    let out = '';
    if (etaHere) {
      const key = o.id + '|' + o.eta_at, done = texted.has(key);
      out += done
        ? '<p class="etaline">✓ Texted ' + esc(firstName(o)) + ': arriving around ' + clockEn(etaHere.at) + ' · <a href="' + smsHref(o) + '" data-act="texted" data-key="' + esc(key) + '">Text again</a></p>'
        : '<a class="next" href="' + smsHref(o) + '" data-act="texted" data-key="' + esc(key) + '">Text ' + esc(firstName(o)) + ': arriving ' + clockEn(etaHere.at) + '</a>' +
          '<p class="etaline">Wrong time? Pick how far out you are:</p>' + minButtons(o.stage);
    }
    if (!nxt) return out;
    if (needsPay) return out + '<button class="next" type="button" disabled>Waiting on payment</button>';
    if (TEXT_STEPS[nxt.key]) {
      if (etaAsk[o.id] === nxt.key) return out + '<p class="etaline"><b>Couldn’t get the drive time.</b> How far away are you?</p>' + minButtons(nxt.key);
      return out + '<button class="next" type="button" data-act="omw" data-stage="' + nxt.key + '"' + (finding[o.id] ? ' disabled>Working out your arrival time…' : '>' + TEXT_STEPS[nxt.key]) + '</button>';
    }
    const waiting = etaHere && !texted.has(o.id + '|' + o.eta_at);
    return out + '<button class="next' + (waiting ? ' alt' : '') + '" type="button" data-act="next" data-stage="' + nxt.key + '">Mark: ' + esc(nxt.label) + '</button>';
  }
  const getPos = () => new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: false, timeout: 10000, maximumAge: 120000 });
  });
  async function onMyWay(id, stage, minutes) {
    const req = { action: 'eta', id, stage };
    if (minutes) req.minutes = minutes;
    else {
      finding[id] = true; render();
      const pos = await getPos();
      if (pos) { req.lat = pos.lat; req.lng = pos.lng; }
    }
    if (!req.minutes && !req.lat) { delete finding[id]; etaAsk[id] = stage; return render(); }
    await new Promise(r => { const go = () => busy ? setTimeout(go, 250) : r(); go(); });
    await run(req);
    delete finding[id]; render();
  }

  /* ---------- screens ---------- */
  function showPin(err) { $('#app').hidden = true; $('#pinForm').hidden = false; $('#pinErr').textContent = err || ''; $('#pin').focus(); }
  function showApp() { $('#pinForm').hidden = true; $('#app').hidden = false; $('#demo').hidden = !PREVIEW; }

  function render() {
    const zones = Array.from(new Set(orders.map(o => o.zone).filter(Boolean)));
    $('#filters').innerHTML = ['all'].concat(zones).map(z => '<button type="button" data-z="' + esc(z) + '" class="' + (z === filter ? 'on' : '') + '">' + (z === 'all' ? 'All zones' : esc(z)) + '</button>').join('');
    const counts = {};
    orders.forEach(o => { counts[o.stage] = (counts[o.stage] || 0) + 1; });
    const parts = STAGES.filter(s => counts[s.key]).map(s => counts[s.key] + ' ' + s.label.toLowerCase());
    const stamp = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('#summary').textContent = (orders.length ? parts.join(' · ') : 'No open orders') + ' · ' + stamp;
    const shown = orders.filter(o => filter === 'all' || o.zone === filter);
    if (!shown.length) { $('#list').innerHTML = '<p class="empty">Nothing here right now.</p>'; return; }
    // Open orders grouped by what happens next; finished ones fold away at the bottom.
    const stageIn = (o, a, b) => idxOf(o.stage) >= idxOf(a) && idxOf(o.stage) <= idxOf(b);
    const groups = [
      { title: 'To pick up', items: shown.filter(o => stageIn(o, 'booked', 'on_the_way')) },
      { title: 'At the store', items: shown.filter(o => stageIn(o, 'picked_up', 'folding')) },
      { title: 'Out for delivery', items: shown.filter(o => o.stage === 'out_for_delivery') }
    ].filter(g => g.items.length);
    const done = shown.filter(o => o.stage === 'delivered');
    const doneHtml = done.length
      ? '<details class="done"><summary>Completed today (' + done.length + ')</summary>' + done.map(o =>
          '<div class="mini"><b>' + esc(o.name) + '</b><span>' + (hasTotal(o) ? '$' + Number(o.bill_total || o.order_total).toFixed(2) + ' · ' : '') + (o.paid ? '✓ Paid' : 'Not paid') + '</span></div>').join('') +
        '<p class="meta" style="margin:6px 4px 0">Older orders are in the Google Sheet.</p></details>'
      : '';
    $('#list').innerHTML = (groups.length ? '' : '<p class="empty">No open orders right now.</p>') + groups.map(g =>
      '<h2 class="group">' + g.title + ' <span>' + g.items.length + '</span></h2>' + g.items.map(card).join('')).join('') + doneHtml;
  }

  function card(o) {
    {
      const i = idxOf(o.stage), st = STAGES[i], nxt = STAGES[i + 1];
      const chip = o.stage === 'delivered' ? 'done' : o.stage === 'out_for_delivery' || o.stage === 'on_the_way' ? 'out' : '';
      const weighed = i >= idxOf('at_store');
      const maps = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(o.address + ' ' + o.zip);
      const wash = o.wash_temp ? '<span class="chip ' + (/hot/i.test(o.wash_temp) ? 'hot' : 'cold') + '">' + esc(o.wash_temp) + ' wash</span>' : '';
      const dropoff = o.dropoff_window ? '<br>Drop-off ' + esc(when(o.dropoff_label, o.dropoff_window)) : '';
      const needsPay = nxt && idxOf(nxt.key) >= idxOf('out_for_delivery') && !o.paid;
      const money = '$' + Number(o.order_total || 0).toFixed(2);
      const payChip = o.paid ? '<span class="chip paid">✓ Paid</span>' : (weighed && hasTotal(o) ? '<span class="chip unpaid">Not paid</span>' : '');
      const covered = o.subscriber && hasTotal(o) && Number(o.order_total) === 0 && !isTest(o);
      const testNote = isTest(o) ? '<p><b>Test order:</b> Square bills $1.00 instead of the ' + money + ' total, so testing costs a dollar.</p>' : '';
      const otherWay = '<button class="undo" type="button" data-act="paid">Paid another way (cash, Zelle)? Mark paid</button>';
      let pay = '';
      if (weighed && hasTotal(o)) {
        if (o.paid) pay = '<div class="pay ok"><b>✓ Paid · ' + (o.bill_total ? billMoney(o) : money) + '</b><button class="undo" type="button" data-act="unpaid">Undo</button></div>';
        else if (o.bill_sent && o.bill_url) pay = '<div class="pay"><b>Bill sent · ' + billMoney(o) + ' · waiting for payment</b>' + testNote +
          '<a class="textlink" href="' + smsHref(o) + '">Text the payment link</a>' +
          '<p>Attach the photo of the scale. This turns to Paid by itself once they pay.</p>' + otherWay + '</div>';
        else if (covered) pay = '<div class="pay"><b>Covered by Loads Weekly · $0.00</b>' +
          '<button class="bill" type="button" data-act="bill">Mark covered</button>' +
          '<p>This pickup is inside their ' + PLAN.lbsPerWeek + ' lb for the week, so there’s nothing to charge.</p></div>';
        else pay = '<div class="pay"><b>Not paid yet · ' + money + '</b>' +
          '<button class="bill" type="button" data-act="bill">Send bill · ' + (isTest(o) ? '$1.00 (test)' : money) + '</button>' + testNote +
          (o.subscriber
            ? '<p>Loads Weekly member: the card on their plan is charged right away.</p>'
            : '<p>Saved card on file? It’s charged right away. First-time customer? You’ll get a payment link to text them.</p>') + otherWay + '</div>';
      }
      return '<article class="order" data-id="' + esc(o.id) + '">' +
        '<div class="otop"><div><div class="oname">' + esc(o.name) + '</div>' + (o.subscriber ? '<span class="chip plan">Loads Weekly' + (o.plan_extra ? ' · extra pickup' : '') + '</span>' : '') + (isEs(o) ? '<span class="chip es">Habla español</span>' : '') + '<p class="meta">Pickup ' + esc(when(o.pickup_label, o.pickup_window)) + ' · ' + esc(o.zone) + (isFirst(o) ? ' · first order' : ' · repeat customer') + dropoff + '</p></div><div class="chips">' + wash + payChip + '<span class="chip ' + chip + '">' + esc(st.label) + '</span></div></div>' +
        '<p class="meta">' + esc(o.address) + ', ' + esc(o.zip) + ' · <a href="' + maps + '" target="_blank" rel="noopener">Directions</a>' + (o.notes ? '<br>Note: ' + esc(o.notes) : '') + '</p>' +
        '<div class="links"><a href="tel:' + digits(o.phone) + '">Call</a><a href="' + smsHref(o) + '">' + (isEs(o) ? 'Text update (Spanish)' : 'Text update') + '</a>' + (o.track_url ? '<a href="' + esc(o.track_url) + '" target="_blank" rel="noopener">Tracker</a>' : '') + '</div>' +
        stepBlock(o, nxt, needsPay) +
        '<div class="under"><span class="meta" style="margin:0">' + esc(o.id) + '</span><span>' + (canCancel(o) ? '<button class="undo" type="button" data-act="cancel">Cancel order</button>' : '') + (i > 0 ? (canCancel(o) ? ' · ' : '') + '<button class="undo" type="button" data-act="back" data-stage="' + STAGES[i - 1].key + '">Undo to ' + esc(STAGES[i - 1].label.toLowerCase()) + '</button>' : '') + '</span></div>' +
        (cancelAsk[o.id] ? '<div class="cancelask"><b>Cancel ' + esc(firstName(o)) + '’s pickup?</b><div><button type="button" class="yes" data-act="cancel-yes">Yes, cancel it</button><button type="button" data-act="cancel-no">Keep it</button></div></div>' : '') +
        (weighed ? '<div class="weigh"><div><label for="w-' + esc(o.id) + '">Weight (lbs)</label><input id="w-' + esc(o.id) + '" type="number" step="0.1" min="0" inputmode="decimal" value="' + esc(o.weight_lbs) + '" data-w></div><div><label for="t-' + esc(o.id) + '">Total ($)</label><input id="t-' + esc(o.id) + '" type="number" step="0.01" min="0" inputmode="decimal" value="' + esc(o.order_total) + '" data-t></div><button type="button" data-act="weight">Save</button><small>Weigh it dry, before washing. Total fills in as ' + priceHelp(o) + '. Edit it if needed.</small></div>' : '') +
        pay +
        '</article>';
    }
  }

  /* ---------- actions ---------- */
  $('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.z; render(); } });
  $('#list').addEventListener('input', e => {
    if (!e.target.matches('[data-w]')) return;
    const card = e.target.closest('.order'), o = orders.find(x => x.id === card.dataset.id), w = Number(e.target.value);
    if (o && w > 0) card.querySelector('[data-t]').value = totalFor(o, w).toFixed(2);
  });
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const card = b.closest('.order'), id = card.dataset.id;
    // The arrival-time text: Messages opens (the link does that), and the card notes it was sent.
    if (b.dataset.act === 'texted') { markTexted(b.dataset.key); return setTimeout(render, 400); }
    if (b.dataset.act === 'omw') return onMyWay(id, b.dataset.stage);
    if (b.dataset.act === 'cancel') { cancelAsk[id] = true; return render(); }
    if (b.dataset.act === 'cancel-no') { delete cancelAsk[id]; return render(); }
    if (b.dataset.act === 'cancel-yes') { b.disabled = true; return cancelOrder(id); }
    if (b.dataset.act === 'eta') { delete etaAsk[id]; b.disabled = true; return onMyWay(id, b.dataset.stage, Number(b.dataset.min)); }
    if (b.dataset.act === 'weight') return run({ action: 'set_weight', id, weight_lbs: card.querySelector('[data-w]').value, order_total: card.querySelector('[data-t]').value });
    if (b.dataset.act === 'paid' || b.dataset.act === 'unpaid') { b.disabled = true; return run({ action: 'set_paid', id, paid: b.dataset.act === 'paid' }); }
    if (b.dataset.act === 'bill') { b.disabled = true; b.textContent = 'Sending bill...'; return run({ action: 'send_bill', id }); }
    b.disabled = true;
    run({ action: 'set_stage', id, stage: b.dataset.stage });
  });
  // Refresh reloads the whole page: newest orders and the newest version of the app. The PIN is remembered.
  $('#refresh').addEventListener('click', () => {
    const b = $('#refresh'); b.disabled = true; b.textContent = 'Refreshing...';
    location.reload();
  });
  $('#note').addEventListener('click', e => {
    const u = e.target.closest('[data-undo-cancel]'); if (!u) return;
    u.disabled = true; run({ action: 'uncancel', id: u.dataset.undoCancel });
  });
  $('#driver').value = driverName();
  $('#driver').addEventListener('input', e => { try { localStorage.setItem('loads_driver', e.target.value.trim()); } catch (x) {} render(); });
  $('#signout').addEventListener('click', () => { forgetPin(); orders = []; known = null; $('#list').innerHTML = ''; showPin(''); });
  $('#pinForm').addEventListener('submit', e => {
    e.preventDefault(); pin = $('#pin').value.trim();
    savePin(pin);
    run({ action: 'list' });
  });
  // When a new version of this page goes live, reload so every phone is on the latest.
  const PAGE_VERSION = '2026-11-24e';
  async function checkVersion() {
    try {
      const v = (await (await fetch('version.txt', { cache: 'no-store' })).text()).trim();
      const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#list input');
      if (v && v !== PAGE_VERSION && !busy && !typing) location.reload();
    } catch (e) {}
  }
  setInterval(() => {
    checkVersion();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#list input');
    if (!document.hidden && !$('#app').hidden && !typing) run({ action: 'list' });
  }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden) run({ action: 'list' }); });

  if (PREVIEW || pin) run({ action: 'list' }); else showPin();
})();
</script>
</body>
</html>
