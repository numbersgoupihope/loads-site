<!doctype html>
<html><head><meta charset="utf-8"><title>Things Big Load has never done</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('fonts/Bricolage.ttf') format('truetype');font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:'Instrument Serif';src:url('fonts/InstrumentSerif-Italic.ttf') format('truetype');font-style:italic}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#183a2e}
body{font-family:'Bricolage Grotesque',sans-serif;color:#f3ede2;position:relative}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-stretch:normal}
.abs{position:absolute;transform-origin:50% 50%}
.brand{left:84px;top:150px;font-size:56px;font-weight:800;font-stretch:85%;letter-spacing:-.03em}
.handle{right:84px;top:166px;font-size:30px;color:#b9d6bb}
.hook{left:84px;top:330px;font-size:172px;font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:.9;transform-origin:0 50%}
.hook .serif{color:#f2a5c0;font-size:1.08em}
.kick{left:84px;top:300px;font-size:30px;font-weight:700;letter-spacing:.16em;color:#b9d6bb;transform-origin:0 50%}
.item{left:84px;top:380px;width:920px;transform-origin:0 50%}
.item .n{font-size:40px;font-weight:700;letter-spacing:.1em;color:#f2a5c0;margin-bottom:14px}
.item .t{font-size:150px;font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:.9}
.stamp{left:420px;top:760px;padding:10px 34px 18px;border:12px solid #f2a5c0;border-radius:24px;color:#f2a5c0;font-size:150px;font-weight:800;font-stretch:78%;letter-spacing:.02em;line-height:1;transform-origin:50% 50%}
.stamp2{left:250px;top:735px;padding:10px 34px 18px;border:12px solid #f2a5c0;border-radius:24px;color:#f2a5c0;font-size:150px;font-weight:800;font-stretch:78%;line-height:1}
.endt{left:84px;top:360px;font-size:180px;font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:.9;transform-origin:0 50%}
.endt .serif{color:#f2a5c0;font-size:1.1em}
.url{left:84px;top:840px;background:#f3ede2;color:#183a2e;border-radius:999px;padding:22px 42px;font-size:48px;font-weight:700;transform-origin:0 50%}
.bl{left:330px;top:1140px;width:420px;height:500px;transform-origin:50% 100%}
.sp{width:70px;height:70px;left:0;top:0}
.coin{width:60px;height:60px;left:0;top:0}
</style></head><body>
<div class="abs brand">Loads</div><div class="abs handle">@loadspickup</div>

<div class="abs hook" id="hook">Things<br>Big Load<br><span class="serif">has never done.</span></div>
<div class="abs kick" id="kick">THINGS BIG LOAD HAS NEVER DONE</div>
<div class="abs item" id="it0"><div class="n">01 / 05</div><div class="t">Separated darks.</div></div>
<div class="abs item" id="it1"><div class="n">02 / 05</div><div class="t">Waited for a dryer.</div></div>
<div class="abs item" id="it2"><div class="n">03 / 05</div><div class="t">Matched socks.</div></div>
<div class="abs item" id="it3"><div class="n">04 / 05</div><div class="t">Carried a hamper up 3 flights.</div></div>
<div class="abs item" id="it4"><div class="n">05 / 05</div><div class="t">Folded a fitted sheet.</div></div>
<div class="abs stamp" id="stamp">NEVER.</div>
<div class="abs stamp2" id="stamp2">NEVER EVER.</div>
<div class="abs endt" id="endt">He just<br>has <span class="serif">Loads.</span></div>
<div class="abs url" id="url">loadspickup.com</div>

<div class="abs bl" id="bl"></div>
<svg class="abs sp" id="sp0" viewBox="0 0 70 70"><path d="M35 0 L41 29 L70 35 L41 41 L35 70 L29 41 L0 35 L29 29 Z" fill="#f3ede2"/></svg>
<svg class="abs sp" id="sp1" viewBox="0 0 70 70"><path d="M35 0 L41 29 L70 35 L41 41 L35 70 L29 41 L0 35 L29 29 Z" fill="#f2a5c0"/></svg>
<svg class="abs sp" id="sp2" viewBox="0 0 70 70"><path d="M35 0 L41 29 L70 35 L41 41 L35 70 L29 41 L0 35 L29 29 Z" fill="#b9d6bb"/></svg>
<div id="coins"></div>

<script src="lib.js"></script>
<script>
$('#bl').innerHTML = bigLoadSVG('big');
const big = $('#big');
const DUR = 11.0;
// item windows and the moment each stamp lands
const IT = [[1.6, 3.0], [3.0, 4.4], [4.4, 5.8], [5.8, 7.2], [7.2, 8.9]];
const STAMP = IT.map(([a]) => a + 0.55);
const END = 8.9;
// coins for the "has Loads" payoff
const coinSVG = '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="#e8c27a" stroke="#14251f" stroke-width="5"/><text x="30" y="40" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="30" fill="#14251f">$</text></svg>';
$('#coins').innerHTML = Array.from({ length: 10 }, (_, i) => `<div class="abs coin" id="c${i}">${coinSVG}</div>`).join('');

function seek(t) {
  t = Math.min(t, DUR - 0.0001);
  // hook
  const hIn = E.out(prog(t, -0.15, 0.4)), hOut = E.in(prog(t, 1.4, 0.2));
  put('#hook', { y: (1 - hIn) * 80 - hOut * 60, o: hIn * (1 - hOut) });
  const kIn = E.out(prog(t, 1.55, 0.3)), kOut = E.in(prog(t, END - 0.2, 0.2));
  put('#kick', { o: kIn * (1 - kOut) });

  // items slide up in, slide up out
  IT.forEach(([a, b], i) => {
    const qi = E.out(prog(t, a, 0.35)), qo = E.in(prog(t, b - 0.18, 0.18));
    put('#it' + i, { y: (1 - qi) * 120 - qo * 120, o: qi * (1 - qo) * (t >= a ? 1 : 0) });
  });
  // stamp slams on items 1-4, the big one on item 5
  let st = { o: 0 }, st2 = { o: 0 }, shake = 0;
  STAMP.forEach((s, i) => {
    const [a, b] = IT[i];
    if (t >= s && t < b) {
      const q = prog(t, s, 0.18), out = E.in(prog(t, b - 0.18, 0.18));
      const sc = lerp(2.4, 1, E.out(q));
      const o = Math.min(1, q * 3) * (1 - out);
      if (i < 4) st = { s: sc, r: -9 + (i % 2) * 5, o, y: [40, 40, -60, 110][i] };
      else st2 = { s: sc, r: -6, o };
      if (t - s < 0.25) shake = Math.sin((t - s) * 90) * 14 * (1 - (t - s) / 0.25);
    }
  });
  put('#stamp', st); put('#stamp2', st2);
  document.body.style.transform = `translate(${shake}px, ${shake * 0.4}px)`;

  // end card
  const eIn = E.out(prog(t, END + 0.1, 0.4));
  put('#endt', { y: (1 - eIn) * 80, o: eIn });
  const uIn = E.back(prog(t, END + 0.7, 0.45));
  put('#url', { s: Math.max(0.001, uIn), o: prog(t, END + 0.7, 0.1) });

  // Big Load: idle bob, reacts to each stamp
  let y = 0, sx = 1, sy = 1, r = 0;
  const bob = Math.sin(t * 3.4) * 0.015;
  STAMP.forEach((s, i) => { const l = land(prog(t, s + 0.02, 0.32)); sx *= l.sx; sy *= l.sy; });
  // item 5: laughing bounce
  if (t > STAMP[4] + 0.15 && t < END) { const p = ((t - STAMP[4] - 0.15) * 3.2) % 1; const h = hop(p, 50); y = h.y; sx *= h.sx; sy *= h.sy; }
  // end card: hop and spin
  if (t >= END + 0.2) { const p = prog(t, END + 0.2, 0.6); const h = hop(p, 220); y = h.y; sx *= h.sx; sy *= h.sy; r = E.inOut(p) * 360; }
  put('#bl', { y, r, sx: 1.35 * sx * (1 - bob), sy: 1.35 * sy * (1 + bob) });
  // poses per item
  const inItem = i => t >= IT[i][0] && t < IT[i][1];
  const sip = Math.max(E.inOut(prog(t, 0.3, 0.35)) * (1 - E.inOut(prog(t, 1.2, 0.3))), inItem(0) ? E.inOut(prog(t, STAMP[0] + 0.2, 0.3)) * (1 - E.inOut(prog(t, IT[0][1] - 0.3, 0.25))) : 0,
                      t > END + 1.0 ? E.inOut(prog(t, END + 1.0, 0.35)) : 0);
  const wave = inItem(1) ? 65 * Math.sin(prog(t, STAMP[1] + 0.1, 0.8) * Math.PI) : inItem(3) ? 50 * Math.sin(prog(t, STAMP[3] + 0.1, 0.8) * Math.PI) : 0;
  blPose(big, { sip, wave, smile: 1, glint: inItem(3) ? prog(t, STAMP[3] + 0.3, 0.35) : (t < 1.4 ? prog(t, 0.9, 0.35) : 0) });
  // item 3: the sock on his head wiggles ("matched socks")
  const wig = inItem(2) ? Math.sin((t - IT[2][0]) * 18) * 14 * Math.sin(prog(t, STAMP[2], 0.9) * Math.PI) : 0;
  big.querySelector('.sock').setAttribute('transform', `rotate(${wig} 250 134)`);

  // sparkles with each stamp
  const lastStamp = STAMP.filter(s => s <= t).pop();
  [[880, 700], [120, 1000], [940, 1150]].forEach(([x, yy], k) => {
    const q = lastStamp ? prog(t, lastStamp + k * 0.05, 0.5) : 0;
    put('#sp' + k, { x, y: yy, s: Math.sin(q * Math.PI) * 1.1, r: q * 90, o: q > 0 && q < 1 ? 1 : 0 });
  });
  // coins shower on the end card
  for (let i = 0; i < 10; i++) {
    const q = prog(t, END + 0.3 + i * 0.07, 1.3);
    const x0 = 540 + Math.cos(i * 2.4) * 60, vx = Math.cos(i * 1.7) * 520, vy = -1400 - (i % 3) * 200;
    const tt = q * 1.3;
    put('#c' + i, { x: x0 + vx * tt - 30, y: 1250 + vy * tt + 1900 * tt * tt, r: q * 720 * (i % 2 ? 1 : -1), o: q > 0 && q < 1 ? 1 : 0 });
  }
}
seek(0);
</script>
</body></html>
