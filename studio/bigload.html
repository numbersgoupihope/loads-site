<!doctype html>
<html><head><meta charset="utf-8"><title>Meet Big Load</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url('fonts/Bricolage.ttf') format('truetype');font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:'Instrument Serif';src:url('fonts/InstrumentSerif-Italic.ttf') format('truetype');font-style:italic}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#183a2e}
body{font-family:'Bricolage Grotesque',sans-serif;color:#f3ede2;position:relative}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.abs{position:absolute}
.brand{left:72px;top:64px;font-size:44px;font-weight:800;font-stretch:85%;letter-spacing:-.03em}
.tag{right:72px;top:76px;font-size:26px;color:#b9d6bb}
h1{position:absolute;left:72px;top:150px;margin:0;font-size:150px;font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:.88}
h1 .serif{color:#f2a5c0;font-size:1.06em}
.hero{left:520px;top:300px;transform-origin:0 0;transform:scale(1.25)}
.facts{left:72px;top:520px;width:430px;font-size:32px;line-height:1.3}
.facts p{margin:0 0 26px}
.facts b{display:block;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#b9d6bb;font-weight:600;margin-bottom:6px}
.poses{left:72px;right:72px;bottom:70px;height:250px;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid rgba(243,237,226,.18);padding-top:28px}
.pose{width:300px;text-align:center;font-size:24px;color:#b9d6bb}
.pose svg{width:190px;height:226px;display:block;margin:0 auto 10px}
</style></head><body>
<div class="abs brand">Loads</div><div class="abs tag">character sheet</div>
<h1>Meet<br>Big <span class="serif">Load.</span></h1>
<div class="abs hero" id="hero"></div>
<div class="abs facts">
<p><b>Lives in</b>A bag. A nice one.</p>
<p><b>Has done laundry</b>Never. Not once.</p>
<p><b>Drinks</b>Iced matcha, oat milk, extra ice.</p>
<p><b>Catchphrase</b><span class="serif" style="font-size:40px;color:#f2a5c0">“I don't do chores. I do Loads.”</span></p>
</div>
<div class="abs poses">
<div class="pose" id="p1"></div><div class="pose" id="p2"></div><div class="pose" id="p3"></div>
</div>
<script src="lib.js"></script>
<script>
$('#hero').innerHTML = bigLoadSVG('bl');
['p1','p2','p3'].forEach((p,i)=>{ $('#'+p).innerHTML = bigLoadSVG('bl'+i) + ['Unbothered','Sipping','Hey.'][i]; });
blPose($('#bl1'), { sip: 1 });
blPose($('#bl2'), { wave: 70, smile: 1 });
</script>
</body></html>
